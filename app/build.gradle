import com.android.build.api.artifact.SingleArtifact

plugins {
    alias(libs.plugins.android.application)
}

def keystorePropertiesFile = file('../keystore/keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.yieye.xiangqi'
    compileSdk 36

    defaultConfig {
        applicationId "com.yieye.xiangqi"
        minSdk 24
        targetSdk 34
        versionCode 35
        versionName "0.0.35"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 显式指定 ABI，确保只打包 arm64 架构
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    androidResources {
        noCompress 'pikafish.nnue'
    }

    // 关键：防止系统对 .so 文件进行压缩，这样它才具备执行权限
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        debug {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

}

// 打包完成后复制到的目录
def outputApkDir = "${project.projectDir.absolutePath}/build/apk"

androidComponents {
    onVariants(selector().all()) { variant ->
        // 确定输出文件名
        variant.outputs.forEach { output ->
            output.outputFileName.set("yi_${variant.buildType}_${android.defaultConfig.versionName}.apk")
        }

        // 打包完成后做的一些事,复制apk到指定文件夹
        def copyApkTask = tasks.register("copyApk${variant.name.capitalize()}", Copy) {
            from variant.artifacts.get(SingleArtifact.APK.INSTANCE)
            into outputApkDir
        }
        afterEvaluate {
            tasks.named("assemble${variant.name.capitalize()}").configure {
                finalizedBy(copyApkTask)
            }
        }
    }
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.activity
    // 预留 JVM 单元测试（Utils 的 FEN/中文记谱/协议解析为纯函数，适合单测）
    testImplementation libs.junit

    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.24.3'
}